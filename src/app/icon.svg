<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="avGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#avGrad)" />
  
  <!-- Subtle inner border for contrast on light and dark browser tabs -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- "AV" Bold Modern Monogram -->
  <text 
    x="32" 
    y="42" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="27" 
    font-weight="900" 
    letter-spacing="-1.5px" 
    fill="#ffffff"
  >AV</text>

  <!-- High-tech accent dot for visual balance -->
  <circle cx="50" cy="18" r="3.5" fill="url(#accentGrad)" />
</svg>
